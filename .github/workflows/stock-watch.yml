name: Switch 2 塞尔达限定机监控

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: stock-watch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 检查
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python stock-watch/watch.py
      - name: 保存已通知记录
        run: |
          git config user.name "stock-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-watch/state.json
          git diff --cached --quiet || (git commit -m "Update stock-watch state [skip ci]" && git push)
