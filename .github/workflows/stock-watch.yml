name: Costco 塞尔达限定机上架提醒

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: stock-watch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装浏览器
        run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: 检查
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python stock-watch/watch.py
      - name: 保存已通知记录
        run: |
          git config user.name "stock-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-watch/state.json
          git diff --cached --quiet || (git commit -m "Update stock-watch state [skip ci]" && git push)
